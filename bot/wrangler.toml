# Cloudflare Worker = the Telegram bot brain (free, always on).
# Receives Telegram messages (webhook) and dispatches GitHub Actions.

name = "video-forge-bot"
main = "src/index.js"
compatibility_date = "2026-01-01"

# Non-secret variables (the target repo).
[vars]
GH_REPO = "juanberrio0399/video-forge"

# Phase 7: photo editor. The Worker stores the SOURCE in R2 and dispatches photo_edit.yml
# (the actual retouch runs on Actions with GFPGAN/Real-ESRGAN to preserve identity).
# R2 keeps the source ONLY while iterating (deleted on Save) + session state.
# AI OS clock: every 30 min dispatches the Orchestrator and, on even hours, the live brain (GitHub skips crons).
[triggers]
crons = ["*/30 * * * *"]

# AI OS: internal channels to the Radar and Viento panels (same account; no public URL).
# ALL [[services]] are commented out: the deploy failed (Cloudflare error 10143)
# because the target Workers do not exist in this account.
# /p/radar, /p/viento y /v/*/api/* responden 503 "Panel no conectado" mientras no existan;
# bot/src/index.js guards every use of env.RADAR/env.VIENTO (if (!svc) and && env.VIENTO).
# To re-enable one: uncomment its block and confirm the Worker is in the same account.
# [[services]]
# binding = "RADAR"
# service = "radar-bot"
# entrypoint = "OSGateway"

# [[services]]
# binding = "VIENTO"
# service = "tienda"
# entrypoint = "OSGateway"

[[r2_buckets]]
binding = "R2"
bucket_name = "video-forge"

# Secretos (NO van aqui; se ponen con `wrangler secret put <NOMBRE>`):
#   TELEGRAM_BOT_TOKEN        -> token de @BotFather
#   TELEGRAM_WEBHOOK_SECRET   -> random string (the same one in setWebhook)
#   OWNER_CHAT_ID             -> your Telegram chat id (only you can send)
#   GH_TOKEN                  -> GitHub PAT fine-grained con Actions: Read/Write
