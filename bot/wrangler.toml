# Cloudflare Worker = cerebro del bot de Telegram (gratis, siempre encendido).
# Recibe los mensajes de Telegram (webhook) y dispara GitHub Actions.

name = "video-forge-bot"
main = "src/index.js"
compatibility_date = "2026-01-01"

# Variables NO secretas (el repo objetivo).
[vars]
GH_REPO = "juanberrio0399/video-forge"

# Fase 7: editor de fotos. El Worker guarda el ORIGEN en R2 y dispara photo_edit.yml
# (el retoque real corre en Actions con GFPGAN/Real-ESRGAN para preservar la identidad).
# R2 guarda el origen SOLO mientras se itera (se borra al Guardar) + el estado de sesion.
# Reloj del AI OS: cada 30 min dispara el Orchestrator y, en horas pares, el cerebro en vivo (GitHub se salta crons).
[triggers]
crons = ["*/30 * * * *"]

# AI OS: canales internos hacia los paneles de Radar y Viento (misma cuenta; sin URL pública).
# TODOS los [[services]] estan comentados: el deploy fallaba (error 10143 de Cloudflare)
# porque los Workers de destino no existen en esta cuenta.
# /p/radar, /p/viento y /v/*/api/* responden 503 "Panel no conectado" mientras no existan;
# bot/src/index.js protege cada uso de env.RADAR/env.VIENTO (if (!svc) y && env.VIENTO).
# Para reactivar uno: descomenta su bloque y confirma que el Worker este en la misma cuenta.
# [[services]]
# binding = "RADAR"
# service = "radar-bot"
# entrypoint = "OSGateway"

# [[services]]
# binding = "VIENTO"
# service = "tienda"
# entrypoint = "OSGateway"

[[r2_buckets]]
binding = "R2"
bucket_name = "video-forge"

# Secretos (NO van aqui; se ponen con `wrangler secret put <NOMBRE>`):
#   TELEGRAM_BOT_TOKEN        -> token de @BotFather
#   TELEGRAM_WEBHOOK_SECRET   -> cadena aleatoria (la misma en setWebhook)
#   OWNER_CHAT_ID             -> tu chat id de Telegram (solo tu puedes mandar)
#   GH_TOKEN                  -> GitHub PAT fine-grained con Actions: Read/Write
