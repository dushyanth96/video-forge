name: Deploy bot (Cloudflare)

# Despliega el Worker del bot a Cloudflare desde la nube (sin terminal local),
# carga sus secretos y registra el webhook de Telegram automaticamente.
# Requiere estos GitHub Secrets:
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID,
#   TELEGRAM_BOT_TOKEN, GH_TOKEN, OWNER_CHAT_ID, TELEGRAM_WEBHOOK_SECRET

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: bot
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Verificar secretos requeridos
        env:
          S_TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          S_TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          S_OWNER_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
          S_GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          fail=0
          if [ -z "$S_TELEGRAM_BOT_TOKEN" ]; then echo "::error::Falta el GitHub Secret TELEGRAM_BOT_TOKEN"; fail=1; fi
          if [ -z "$S_TELEGRAM_WEBHOOK_SECRET" ]; then echo "::error::Falta el GitHub Secret TELEGRAM_WEBHOOK_SECRET (sin el, toda entrega del webhook responde 403)"; fail=1; fi
          if [ -z "$S_OWNER_CHAT_ID" ]; then echo "::error::Falta el GitHub Secret OWNER_CHAT_ID"; fail=1; fi
          if [ -z "$S_GH_TOKEN" ]; then echo "::error::Falta el GitHub Secret GH_TOKEN"; fail=1; fi
          exit $fail

      - name: Desplegar Worker
        run: |
          for i in 1 2 3; do
            npx --yes wrangler@4 deploy --var APP_BUILD:"${GITHUB_SHA::7}" | tee deploy.log && break
            echo "deploy reintento $i (hipo de Cloudflare)"; sleep 12
          done
          grep -qE 'https://[a-zA-Z0-9._-]+\.workers\.dev' deploy.log

      - name: Cargar secretos del Worker
        env:
          S_TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          S_GH_TOKEN: ${{ secrets.GH_TOKEN }}
          S_OWNER_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
          S_TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          S_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          S_YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          S_YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          S_YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          put(){ for i in 1 2 3; do printf '%s' "$2" | npx --yes wrangler@4 secret put "$1" && return 0; echo "reintento $1 ($i)"; sleep 10; done; echo "no pude poner $1"; return 1; }
          put TELEGRAM_BOT_TOKEN "$S_TELEGRAM_BOT_TOKEN"
          put GH_TOKEN "$S_GH_TOKEN"
          put OWNER_CHAT_ID "$S_OWNER_CHAT_ID"
          put TELEGRAM_WEBHOOK_SECRET "$S_TELEGRAM_WEBHOOK_SECRET"
          put GEMINI_API_KEY "$S_GEMINI_API_KEY"
          put YT_CLIENT_ID "$S_YT_CLIENT_ID"
          put YT_CLIENT_SECRET "$S_YT_CLIENT_SECRET"
          put YT_REFRESH_TOKEN "$S_YT_REFRESH_TOKEN"

      - name: Registrar webhook de Telegram
        env:
          WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
        run: |
          URL=$(grep -oE 'https://[a-zA-Z0-9._-]+\.workers\.dev' deploy.log | head -1)
          if [ -z "$URL" ]; then echo "No pude leer la URL del Worker"; exit 1; fi
          echo "Worker URL: $URL"
          RESP=$(curl -s "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/setWebhook" \
            --data-urlencode "url=${URL}" \
            --data-urlencode "secret_token=${{ secrets.TELEGRAM_WEBHOOK_SECRET }}")
          echo "Telegram: $RESP"
          echo "$RESP" | grep -q '"ok":true' || { echo "setWebhook fallo"; exit 1; }
          # Autoprueba de la puerta del webhook: con el secreto correcto el Worker
          # debe responder 200 y con uno incorrecto 403. Asi un desajuste (secreto
          # vacio o distinto en el Worker) se detecta en el deploy, antes de que
          # Telegram falle con "Wrong response from the webhook: 403 Forbidden".
          ok_code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "X-Telegram-Bot-Api-Secret-Token: $WEBHOOK_SECRET" \
            -H "Content-Type: application/json" --data '{}' "$URL")
          bad_code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "X-Telegram-Bot-Api-Secret-Token: invalid" \
            -H "Content-Type: application/json" --data '{}' "$URL")
          echo "Webhook gate: correcto=$ok_code (esperado 200), incorrecto=$bad_code (esperado 403)"
          if [ "$ok_code" != "200" ] || [ "$bad_code" != "403" ]; then
            echo "::error::La puerta del webhook no responde como se espera; verifica que el Worker tenga el mismo TELEGRAM_WEBHOOK_SECRET (wrangler secret list)"
            exit 1
          fi
          # Bot menu button -> opens the Mini App (app-style interface).
          MB=$(curl -s "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/setChatMenuButton" \
            --data-urlencode 'menu_button={"type":"web_app","text":"Brain","web_app":{"url":"'"$URL"'/os?v='"${GITHUB_SHA::7}"'"}}')
          echo "MenuButton: $MB"
          # Bot identity "Video Forge": short description (profile), description (empty chat) and commands.
          TB="https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}"
          curl -s "$TB/setMyShortDescription" --data-urlencode "short_description=Video Forge — SkillGroX control center for automated content generation and publishing (The Data Lens & Oddly Loop)." >/dev/null
          curl -s "$TB/setMyDescription" --data-urlencode "description=Video Forge — SkillGroX control center for automated content generation and publishing. Produce, review, approve and schedule videos and Shorts for The Data Lens and Oddly Loop, automatically, from your phone. Open the app with the menu button to see metrics, the best-hour calendar, and approve each video before it goes live." >/dev/null
          curl -s "$TB/setMyCommands" --data-urlencode 'commands=[{"command":"start","description":"🏠 Main menu"},{"command":"panel","description":"📊 Channel panel (schedule)"},{"command":"reporte","description":"🔄 Channel metrics report"},{"command":"shorts","description":"🎬 Suggest Shorts from latest video"},{"command":"voz","description":"🎙️ Generate the narration"},{"command":"render","description":"🎬 Render the video (by phases)"},{"command":"receta","description":"🍳 Build a recipe reel"},{"command":"estado","description":"⏳ What is being done now"}]' >/dev/null
          echo "Identidad del bot (descripcion + comandos) actualizada."
          echo "✅ Bot desplegado y webhook activo en $URL"
